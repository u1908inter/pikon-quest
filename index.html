<title>ピコーン・クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one portrait column (max 480px) — battle screen on top, SFC-style black windows with white frames below. */
:root{
  --page:#0b0c10;      /* CRT black behind everything */
  --win:#05060a;       /* window fill */
  --edge:#f3f1ea;      /* window frame and text */
  --dim:#9ea3b2;       /* secondary text */
  --gold:#ffd84a;      /* cursor, gold, rare */
  --magic:#7fb2ff;     /* magic rarity */
  --hp:#5ccf6c; --hpw:#f2c23e; --hpl:#ec5b4b;
  --spark:#ffe14a;
  --uniq:#ff9a3a;       /* unique rarity */
  --setc:#62e07a;       /* set rarity */
  --rare:#e8f0ff;       /* rare monsters: pale silver */
  --legend:#ff6ad5;     /* legendary gear */
  --font:'DotGothic16','MS Gothic','Osaka-Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--edge);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit}
.win{background:var(--win);border:2px solid var(--edge);border-radius:7px;box-shadow:0 0 0 2px var(--win),0 0 0 3px #2a2c36}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.logo{margin:0;font-size:20px;font-weight:400;letter-spacing:.06em;line-height:1.1}
.logo small{display:block;font-size:10px;letter-spacing:.3em;color:var(--spark)}
.topstat{font-size:13px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.topstat b{color:var(--gold);font-weight:400}
.topstat .tjob{font-size:12px;color:#cfe8ff}

.stage{position:relative;aspect-ratio:5/3;width:100%;max-width:100%;overflow:hidden;padding:0}
#cv{touch-action:none;display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:5px}
.hud{position:absolute;inset:6px 8px auto 8px;display:flex;justify-content:space-between;font-size:12px;pointer-events:none;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,1px 1px #000}
.hud .sp{color:var(--spark)}
.bossbar{position:absolute;left:10%;right:10%;top:26px;font-size:11px;text-align:center;text-shadow:1px 1px #000;pointer-events:none}
.bossbar i{display:block;height:6px;margin-top:2px;border:1px solid var(--edge);background:#000}
.bossbar b{display:block;height:100%;background:var(--hpl);width:100%}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);padding:6px 14px;white-space:nowrap;font-size:15px;text-align:center;pointer-events:none;animation:pop .25s ease-out}
.banner.spark{border-color:var(--spark);color:var(--spark);font-size:13px}
.banner.spark b{display:block;font-size:20px;font-weight:400;color:var(--edge);letter-spacing:.08em}
.banner.warn{border-color:var(--hpl);color:#ffb0a6}
.banner.good{border-color:var(--hp);color:#b6f5be}
.banner.gold{border-color:var(--gold);color:var(--gold)}
.banner.card,.banner.uniq,.banner.setb{font-size:13px}
.banner.card{border-color:var(--magic);color:var(--magic)}
.banner.uniq{border-color:var(--uniq);color:var(--uniq)}
.banner.setb{border-color:var(--setc);color:var(--setc)}
.banner.card b,.banner.uniq b,.banner.setb b{display:block;font-size:18px;font-weight:400;color:var(--edge);letter-spacing:.06em}
.banner small{display:block;font-size:11px;color:var(--dim)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.callout{position:absolute;left:8px;bottom:8px;font-size:12px;padding:2px 8px;pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.toast{position:absolute;right:8px;bottom:8px;font-size:12px;padding:2px 8px;pointer-events:none;max-width:70%;text-align:right}

.party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pm{padding:4px 6px 6px;min-width:0;font-size:11px;line-height:1.3}
.pm .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pm .lv{color:var(--dim);font-variant-numeric:tabular-nums}
.pm.dead{opacity:.45}
.pm.empty{color:var(--dim);border-style:dashed;display:grid;place-items:center;min-height:52px}
.bar{height:5px;background:#24262e;margin-top:3px;position:relative}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--hp)}
.bar.mp b{background:var(--magic)}
.num{font-variant-numeric:tabular-nums}

.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sk{position:relative;text-align:left;padding:7px 10px 8px;min-height:66px;cursor:pointer;overflow:hidden;touch-action:manipulation}
.sk:active{transform:translateY(1px)}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(243,241,234,.18);pointer-events:none}
.sk .n{font-size:15px;display:block;padding-right:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .n.kiwami{color:var(--gold)}
.sk .st{font-size:11px;color:var(--gold);letter-spacing:.05em}
.st s{color:#4a4c56;text-decoration:none}
.sk .m{display:block;font-size:10px;color:var(--dim)}
.sk .bar{height:3px}
.sk .bar b{background:var(--gold)}
.sk .auto{position:absolute;right:6px;top:6px;font-size:10px;padding:1px 5px;border:1px solid #4a4c56;border-radius:3px;color:var(--dim);background:var(--win)}
.sk .auto.on{border-color:var(--hp);color:var(--hp)}
.sk.empty{color:var(--dim);border-style:dashed;cursor:default}
.sk.off{opacity:.5}

.log{padding:6px 10px;min-height:5.6em;font-size:13px;line-height:1.4}
.log p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log p:not(:last-child){color:var(--dim)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--win);border:2px solid var(--edge);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.primary{border-color:var(--gold);color:var(--gold);font-size:16px;padding:10px 18px}
.btn.sm{padding:3px 8px;font-size:12px;border-width:1px}
.btn.danger{border-color:var(--hpl);color:#ffb0a6}
.btn[disabled]{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{padding:7px 0;font-size:13px}
.tabs button[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
.tabs button[aria-selected="true"]::before{content:'▶';font-size:9px;margin-right:2px;vertical-align:2px}
.panel{padding:12px 12px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:13px;font-weight:400;color:var(--gold);letter-spacing:.12em}
.panel p{margin:0}
.hint{font-size:12px;color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flsel{display:flex;align-items:center;justify-content:center;gap:14px}
.flsel .big{font-size:30px;min-width:4ch;text-align:center;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;font-size:13px}
.kv span{display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.kv span i{font-style:normal;color:var(--dim)}
.list{display:flex;flex-direction:column;gap:6px}
.li{border:1px solid #3a3c46;border-radius:5px;padding:7px 9px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0;background:transparent;text-align:left;width:100%}
.li:hover{border-color:var(--dim)}
.li.sel{border-color:var(--gold)}
.li .body{flex:1;min-width:0}
.li .t{display:flex;justify-content:space-between;gap:8px}
.li .t > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .d{font-size:12px;color:var(--dim)}
.li.locked{cursor:default;color:var(--dim);border-style:dashed}
.li.grp{border-color:#55586a;background:#0e1018}
.li.grp.open{border-color:var(--dim)}
.li.grp .arrow{color:var(--gold);font-size:11px}
.li.cmp{padding:5px 8px}
.li.sub{border-style:dashed;padding:6px 8px}
.li.sub.open{border-style:solid;border-color:var(--dim)}
.d.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px;margin-bottom:8px}.seg .btn{padding:7px 4px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{font:inherit;font-size:12px;color:var(--dim);background:#0e1018;border:1px solid #3a3c46;border-radius:12px;padding:3px 9px;cursor:pointer}
.chip small{margin-left:4px;opacity:.7}.chip.on{color:var(--gold);border-color:var(--gold)}.chip.up.on{color:#7cf08a;border-color:#7cf08a}
.li.gr{padding:6px 9px}.li.gr .row .btn{flex:none}
.grpbody .grpbody{padding-left:10px;margin-left:6px}
.grpbody{padding-left:14px;border-left:1px dashed #3a3c46;margin-left:8px}
.li canvas{width:36px;height:36px;image-rendering:pixelated;flex:none}
.r0{color:var(--edge)}.r1{color:var(--magic)}.r2{color:var(--gold)}.r3{color:var(--uniq)}.r4{color:var(--setc)}
.li.u3{border-color:#7a4a22}.li.u4{border-color:#2f6a3a}
.pips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:11px}
.pip{color:var(--dim)}.pip.on{color:var(--magic)}
.setb{font-size:12px;line-height:1.5}
.setb .off{color:#5a5d6a}
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.acard{border:1px solid #3a3c46;border-radius:5px;padding:6px 4px;text-align:center;font-size:10px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;overflow-wrap:anywhere}
.acard.on{border-color:var(--magic);color:var(--magic)}
.acard.boss.on{border-color:var(--gold);color:var(--gold)}
.acard.rare.on{border-color:var(--rare);color:var(--rare);box-shadow:inset 0 0 0 1px rgba(232,240,255,.25)}
.rr{color:var(--rare)}
.r5{color:var(--legend)}.li.u5{border-color:#8a3a78}
.banner.legend{border-color:var(--legend);color:var(--legend);font-size:13px}
.banner.legend b{display:block;font-size:18px;font-weight:400;color:var(--edge);letter-spacing:.06em}
.sk.steal{min-height:0;width:100%;padding:6px 10px}
.sk.steal .n{font-size:14px}
.jobhead{display:flex;align-items:center;gap:12px}
.jobhead canvas{width:44px;height:48px;image-rendering:pixelated;flex:none}
.ab{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px dashed #2a2c36}
.ab.lock{color:#5a5d6a}
.cat{font-size:10px;border:1px solid currentColor;border-radius:3px;padding:0 4px;white-space:nowrap}
.cat.atk{color:#ff8a7a}.cat.def{color:#7fb2ff}.cat.spc{color:#c8a8ff}.cat.any{color:var(--gold)}
.mslots{display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.mslot{border:1px solid #3a3c46;border-radius:5px;padding:6px;min-width:0;font-size:12px;text-align:left;background:transparent;cursor:pointer}
.mslot small{display:inline-block;font-size:10px;margin-right:6px;vertical-align:middle}
.mslot .msd{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4}
.mslot.on{border-color:var(--gold)}
.banner.rare{border-color:var(--rare);color:var(--rare);font-size:13px}
.banner.rare b{display:block;font-size:18px;font-weight:400;color:var(--edge);letter-spacing:.06em}
.acard canvas{width:32px;height:32px;image-rendering:pixelated}
.acard.locked{color:#5a5d6a}
.acard.locked canvas{filter:brightness(0) invert(.25)}
.boxrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.boxrow .bx{font-size:22px;color:#4a8cff;font-variant-numeric:tabular-nums}
.up{color:var(--hp)}.down{color:var(--hpl)}
.slots4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.slot{border:1px solid #3a3c46;border-radius:5px;padding:6px 8px;cursor:pointer;background:transparent;text-align:left;min-width:0}
.slot.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.slot small{display:block;color:var(--dim);font-size:10px}
.tag{font-size:10px;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px}
input[type=range]{width:100%;accent-color:#ffd84a}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:10}
.mbox{width:min(420px,100%);padding:16px;display:flex;flex-direction:column;gap:12px;font-size:15px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-sizing:border-box}
.mbox > *{flex-shrink:0}
.mbox p{margin:0}
.mbox .opts{display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:-16px;background:inherit;padding:8px 0 4px;margin-bottom:-4px}
.mbox canvas{width:96px;height:96px;image-rendering:pixelated;align-self:center}
.rec-timer{height:3px;background:#24262e;margin-top:-4px}
.rec-timer b{display:block;height:100%;width:100%;background:var(--gold)}
.mbox ul{margin:0;padding-left:1.2em;font-size:14px}
@media (prefers-reduced-motion: reduce){.banner{animation:none}}
</style>

<div id="app">
  <header class="top">
    <h1 class="logo">ピコーン・クエスト<small>SPARK QUEST</small></h1>

      <button class="btn" data-tab="cfg" role="tab">設定</button>
    </nav>
    <div class="win panel" id="panel"></div>
  </section>
</div>

const sprCache = {};
function getSpr(key, white){
  const ck = key + (white ? '#w' : '');
  if (sprCache[ck]) return sprCache[ck];
  const d = SPR[key], rows = d.rows;
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++){
    const ch = r[i]; if (ch === '.' || ch === ' ') continue;
    const col = white ? '#ffffff' : (d.pal[ch] || BASEPAL[ch]); if (!col) continue;
    x.fillStyle = col; x.fillRect(i, j, 1, 1);
  }});
  return sprCache[ck] = c;
}

const LEGACY_AB = {'mahou:魔法剣': A('魔法剣', 'atk', '通常攻撃にも 技ダメージ%が のる', s => s.pw.magicBlade = true)};

function abRef(v){   // 'ab:<job>:<name>' -> {job, a}
  const [, j, nm] = v.split(':');
  if (!JOBS[j]) return null;
  const a = JOBS[j].ab.find(x => x.n === nm) || LEGACY_AB[j + ':' + nm];
  return a ? {j, a} : null;
}
const mastersCount = () => MAIN_JOBS.filter(j => jobLv(j) >= JOB_MAX).length;
const extraSlots = () => Math.min(4, Math.floor(mastersCount() / 3));
const slotKeys = () => {
  const dbl = S.job === 'suppin', ex = extraSlots() * (dbl ? 2 : 1);
  return ['atk', 'def', 'spc', ...(dbl ? ['atk2', 'def2', 'spc2'] : []), ...Array.from({length: ex}, (_, i) => 'x' + (i + 1))];
};
const slotCat = k => k.startsWith('x') ? 'any' : /^p\d/.test(k) ? 'pow' : k.replace(/\d+$/, '');

const powCount = () => 3 + (facLv('forge') >= 3 ? 1 : 0) + (facLv('forge') >= 5 ? 1 : 0);
const powKeys = () => Array.from({length: powCount()}, (_, i) => 'p' + (i + 1));
const allSlotKeys = () => [...slotKeys(), ...powKeys()];

/* Growth curves (balance pass): linear x gentle exponential, tuned so F50 is a fair fight around hero Lv110-120.
   Past F50 the extra deep multiplier makes it an endgame climb. */
const DEEP_FLOOR = 50;
const deepMul = f => f > DEEP_FLOOR ? Math.pow(BAL.deep, f - DEEP_FLOOR) : 1;
/* Early-game "hump": extra difficulty that peaks around F5 and fades out by F20-30,
   so a first-time player with no gear meets their first wipe near F5 without changing the F50 tuning. */
const BAL = {earlyHp:1.6, earlyAtk:2.6, peak:5, recruitMul:3,
  mid:[[5,1],[10,1.6],[15,2.3],[20,2.5],[25,2.35],[30,1.85],[35,1.55],[40,1.42],[45,1.25],[50,1.1]],   // mid-game enemy power by floor (log-interpolated, held past F50)
  midHpExp:1.15, midAtkExp:0.85,  // how that power is split between enemy HP and attack
  deep:1.05, deepHp:1.03, deepAtk:1.025, postHp:1, postAtk:0.8,   // past F50: per-floor growth, and flat HP / attack multipliers (the crowd is doubled there)                    // per-floor growth past F50
  autoDmg:0.7, autoCd:1.4};     // skills fired by AUTO: damage x0.7, cooldown x1.4 (tapping by hand is stronger)
const midMul = f => { const t = BAL.mid; if (f <= t[0][0]) return t[0][1]; if (f >= t[t.length - 1][0]) return t[t.length - 1][1];
  for (let i = 1; i < t.length; i++) if (f <= t[i][0]){ const [f0, a] = t[i - 1], [f1, b] = t[i]; return a * Math.pow(b / a, (f - f0) / (f1 - f0)); } return 1; };
const hump = (amp, f) => { const x = (f - 1) / (BAL.peak - 1); return 1 + amp * x * x * Math.exp(2 * (1 - x)); };
const gHP0  = f => (1 + 0.40 * (f - 1)) * Math.pow(1.095, f - 1) * hump(BAL.earlyHp, f) * Math.pow(midMul(f), BAL.midHpExp);
/* past F50 the main curve stops: enemies grow only by BAL.deepHp / deepAtk per floor from the F50 level */
const gHP   = f => f <= DEEP_FLOOR ? gHP0(f) : gHP0(DEEP_FLOOR) * BAL.postHp * Math.pow(BAL.deepHp, f - DEEP_FLOOR);
const gAtk0 = f => (1 + 0.30 * (f - 1)) * Math.pow(1.075, f - 1) * hump(BAL.earlyAtk, f) * Math.pow(midMul(f), BAL.midAtkExp);
const gAtk  = f => f <= DEEP_FLOOR ? gAtk0(f) : gAtk0(DEEP_FLOOR) * BAL.postAtk * Math.pow(BAL.deepAtk, f - DEEP_FLOOR);
const gExp  = f => (1 + 0.30 * (f - 1)) * Math.pow(1.04, f - 1);
const gGold = f => (1 + 0.25 * (f - 1)) * Math.pow(1.05, f - 1);

function loadSave(data){
  let src = data && data.save ? data.save : null;
  if (!src){ try { const raw = localStorage.getItem(SAVE_KEY); if (raw) src = JSON.parse(raw); } catch(e){} }
  if (!src || src.v !== 1) return;
  const F = freshSave();
  S = Object.assign(freshSave(), src);
  S.equip = Object.assign(F.equip, src.equip || {});
  S.dbg = F.dbg;   // 公開版: デバッグ倍率は常にオフ
  if (S.speed > 16) S.speed = 1;
  S.stats = Object.assign(F.stats, src.stats || {});
  S.jobs = Object.assign(F.jobs, src.jobs || {});
  if ((src.jobVer || 0) < 3){ for (const j in S.jobs) S.jobs[j].jp = (S.jobs[j].jp || 0) * 3; S.jobVer = 3; }   // JP table became x3: keep earned levels
  if (!JOBS[S.job] || !jobUnlocked(S.job)) S.job = 'senshi';
  S.mslots = Object.assign(F.mslots, src.mslots || {});
  for (const c in S.mslots) if (S.mslots[c] === 'ab:akindo:ぜになげ') S.mslots[c] = 'ab:akindo:札束の威光';   // ability replaced
  // extracted powers moved to their own slots: carry them over from the ability slots
  for (const c of Object.keys(S.mslots)){ const v = S.mslots[c];
    if (v && v.startsWith('u:') && !/^p\d/.test(c)){ S.mslots[c] = null; const free = ['p1', 'p2', 'p3'].find(k => !S.mslots[k]); if (free) S.mslots[free] = v; } }
  if (!src.jobVer){
    for (const j in S.jobs) if (S.jobs[j].jp >= 1500) S.jobs[j].jp = Math.max(S.jobs[j].jp, JOB_T[JOB_MAX - 1]);   // old masters stay masters
    for (const c in S.mslots){ const v = S.mslots[c];
      if (v && v.startsWith('ab:')){ const [, j, i] = v.split(':'); if (/^\d+$/.test(i) && OLD_AB[j]) S.mslots[c] = `ab:${j}:${OLD_AB[j][+i]}`; } }
  }
  if ((src.helpVer || 0) < HELP_VER){ S.seenHelp = {}; S.helpVer = HELP_VER; }   // new guides: show each screen's once more
  S.mats = Object.assign(F.mats, src.mats || {});
  S.craft = Object.assign(F.craft, src.craft || {});
  S.market = Object.assign(F.market, src.market || {});
  S.fac = Object.assign(F.fac, src.fac || {});
  S.stats2 = Object.assign(F.stats2, src.stats2 || {});
  if (S.speed > maxSpeed()) S.speed = maxSpeed();
  while (S.party.length < partySize()) S.party.push(null);
  for (const it of [...S.inv, ...Object.values(S.equip)]) if (it && !it.cards) it.cards = [];
  S.uid = Math.max(S.uid || 0, ...S.allies.map(a => a.id || 0), ...S.inv.map(i => i.id || 0), ...Object.values(S.equip).map(i => (i && i.id) || 0));
  for (const al of S.allies) if (!al.cap999){ al.cap999 = true; al.maxLv = Math.max(al.maxLv, rollMaxLv()); al.capped = al.lv >= al.maxLv; }
}

function activeAbNames(){
  const set = new Set(), jl = jobLv(S.job);
  for (const a of JOBS[S.job].ab) if (jl >= a.lv) set.add(a.n);
  for (const c of slotKeys()){ const v = S.mslots[c]; if (v && v.startsWith('ab:')){ const r = abRef(v); if (r && jobLv(r.j) >= JOB_MAX) set.add(r.a.n); } }

function heroStats(){
  const L = S.hero.lv;
  const s = {hp:60 + 14*(L-1), atk:8 + 2.6*(L-1), def:3 + 1.2*(L-1), crit:5, aspd:0, skill:0, cdr:0, spark:0, exp:0, gold:0,
             hpPct:0, atkPct:0, defPct:0, pw:{}};
  const wRef = activeAbNames().has('ぶきの手入れ');
  for (const it of equipped()){
    const rm = it.slot === 'weapon' && wRef ? 1 + (refMul(it) - 1) * 1.5 : refMul(it);
    for (const k in it.base) s[k] += it.base[k] * rm;
    for (const a of it.aff) s[a.k] += a.v;
    if (it.u) applyUniq(s, it.u);
    if (it.lg) LEGEND[it.lg].fx(s);
    if (it.dx) add(s.pw, it.dx.k, it.dx.v);
    for (const c of it.cards || []) if (c) CARDS[c].fx(s);
  }
  // job: innate bonus + learned abilities
  const J = JOBS[S.job], jl = jobLv(S.job);
  J.bfx(s);
  for (const a of J.ab) if (jl >= a.lv) a.fx(s);
  // master slots (Kanai-style): mastered abilities or extracted unique powers
  for (const c of allSlotKeys()){ const v = S.mslots[c]; if (!v) continue;
    if (v.startsWith('u:')) applyUniq(s, v.slice(2));
    else { const r = abRef(v); if (r && jobLv(r.j) >= JOB_MAX) r.a.fx(s); } }
  if (R && R.charm){ const c = R.charm;
    if (c.exp) s.exp += 50; if (c.gold) s.gold += 100;
    if (c.spark) s.pw.charmSpark = true; if (c.drop) s.pw.charmDrop = true; if (c.tame) s.pw.charmTame = true; if (c.guard) s.pw.charmGuard = true; }
  s.pw.sets = setCounts();
  if (setOn(s, 'raimei', 2)) s.skill += 20;
  if (setOn(s, 'raimei', 6)) s.cdr += 20;
  if (setOn(s, 'kensei', 2)) s.aspd += 20;
  if (setOn(s, 'hoshiyomi', 2)) s.spark += 50;
  if (setOn(s, 'hoshiyomi', 4)) s.cdr += 25;
  if (setOn(s, 'hoshiyomi', 6)) add(s.pw, 'cdReset', 20);
  if (setOn(s, 'kenbu', 2)) add(s.pw, 'swordDmg', 30);
  if (setOn(s, 'teppeki', 2)) s.defPct += 30;
  if (setOn(s, 'teppeki', 4)) s.pw.dmgCut = 20;
  if (setOn(s, 'teppeki', 6)){ add(s.pw, 'reflect', 50); s.hpPct += 30; }
  if (setOn(s, 'shounin', 2)) s.gold += 50;
  if (setOn(s, 'shounin', 4)){ s.exp += 50; s.pw.dropMul = 1.5; }
  if (setOn(s, 'shounin', 6)) s.pw.dropMul = 3;
  if (setOn(s, 'mikazuki', 2)) s.crit += 15;
  if (setOn(s, 'mikazuki', 4)) s.pw.critMul = Math.max(s.pw.critMul || 1.8, 2.5);
  if (setOn(s, 'mikazuki', 6)) s.pw.execute = true;
  if (s.pw.critPlus) s.pw.critMul = (s.pw.critMul || 1.8) + s.pw.critPlus;
  if (s.pw.shippu) s.cdr += 25;
  const reg = Object.keys(S.album).length;
  s.hpPct += reg; s.atkPct += reg;
  if (reg >= Object.keys(CARDS).length) s.spark += 20;
  s.hp *= 1 + s.hpPct / 100; s.atk *= 1 + s.atkPct / 100; s.def *= 1 + s.defPct / 100;
  s.cdr = Math.min(s.cdr, s.pw.shippu ? 60 : 40); s.crit = Math.min(s.crit, 75);
  s.hp = Math.round(s.hp); s.atk = Math.round(s.atk); s.def = Math.round(s.def);
  return s;
}
const ALLY_MAX_LV = 999;
const rollMaxLv = () => 30 + Math.floor((ALLY_MAX_LV - 30) * Math.pow(Math.random(), 2.5));   // most land 30–300, a lucky few near 999
const PLUS_STEP = 0.03;   // each +1 from fusion: +3% HP and attack
const allyName = al => al.name + (al.plus ? `+${al.plus}` : '');
function allyStats(al){
  const sp = SP[al.sp], L = al.lv, pm = 1 + PLUS_STEP * (al.plus || 0);
  return {
    hp: Math.round(45 * Math.max(sp.hp, 1) * (sp.allyMul || 1) * (1 + 0.2 * (L-1)) * al.g.hp * pm),
    atk: Math.round(7 * sp.atk * (sp.allyMul || 1) * (1 + 0.24 * (L-1)) * al.g.atk * pm),
    def: Math.round((2 + 0.9 * (L-1)) * Math.sqrt(sp.hp)),
    int: sp.int,
  };
}
function allyMods(hs){
  const m = {hp:1, atk:1, cd:1};
  if (hs.pw.ouja){ m.hp *= 1.3; m.atk *= 1.3; }
  if (setOn(hs, 'juuou', 2)) m.hp *= 1.3;
  if (setOn(hs, 'juuou', 4)) m.atk *= 1.5;
  if (setOn(hs, 'juuou', 6)){ m.atk *= 2.5; m.cd *= 0.6; }
  if (hs.pw.allyBless){ m.hp *= 1.25; m.atk *= 1.25; }
  if (hs.pw.beast) m.atk *= 1.2;
  m.hp *= 1 + (hs.pw.allyHpPct || 0) / 100;
  m.atk *= 1 + (hs.pw.allyAtkPct || 0) / 100;
  m.cd *= 1 - Math.min(60, hs.pw.allyCdPct || 0) / 100;
  if (hs.pw.endlessSong) m.atk *= 1.5;
  m.def = hs.pw.protes ? 1.3 : 1;
  return m;
}
function sparkChance(f){
  const hs = heroStats();
  let c = clamp(0.012 + 0.004 * (enemyLv(f) - S.hero.lv), 0.003, 0.08);
  if (R && R.isBoss) c *= 2;
  c *= 1 + hs.spark / 100;
  if (hs.pw.kenja) c *= 2;
  if (hs.pw.charmSpark) c *= 2;
  if (S.dbg.spark) c *= 10;
  return Math.min(c, 0.9);
}

/* ---------- items ---------- */
function rollRar(f, boss, noNormal){
  const g = 1 + 0.05 * (f - 1);
  const w = [70 / (1 + 0.08 * (f - 1)), 25, 5 * g, 3 * g, 5 * g];
  if (boss){ w[0] *= 0.3; w[2] *= 3; w[3] *= 4; w[4] *= 4; }
  if (noNormal) w[0] = 0;
  let r = Math.random() * w.reduce((a, b) => a + b);
  for (let i = 0; i < 5; i++){ if (r < w[i]) return i; r -= w[i]; }
  return 0;
}
function genLegend(k, f){
  const L = LEGEND[k], ilv = f + 2, slot = L.slot, r = () => rnd(1.3, 1.5);
  const base = {};
  if (slot === 'weapon') base.atk = Math.round((5 + ilv * 2.6) * r());
  if (slot === 'head'){ base.def = Math.round((2 + ilv * 1.0) * r()); base.hp = Math.round(ilv * 4 * r()); }
  if (slot === 'body'){ base.def = Math.round((3 + ilv * 1.5) * r()); base.hp = Math.round((10 + ilv * 8) * r()); }
  const keys = Object.keys(AFF).sort(() => Math.random() - 0.5).slice(0, 3);
  return {id: ++S.uid, slot, name: L.n, rar:5, ilv, base, aff: keys.map(a => ({k:a, v: Math.round(affVal(a, ilv) * 1.3)})),
          cards: Array(Math.random() < 0.5 ? 2 : 1).fill(null), lg:k};
}
function cardSlotsFor(rar){
  const r = Math.random();
  return rar === 0 ? (r < 0.3 ? 1 : 0) : rar === 1 ? (r < 0.5 ? 1 : 0) : rar === 2 ? (r < 0.3 ? 2 : 1) : (r < 0.35 ? 1 : 0);
}
function genItem(f, boss, noNormal, opt = {}){
  const rar = opt.rar != null ? opt.rar : rollRar(f, boss, noNormal);
  const ilv = opt.ilv || Math.max(1, f + ri(-1, 1));
  const tier = Math.min(5, Math.floor((ilv - 1) / 3));
  let slot = opt.slot || pick(SLOTS), name = null, u = null, set = null;
  if (rar === 3){ u = opt.u || pick(Object.keys(UNIQ)); slot = UNIQ[u].slot; name = UNIQ[u].n; }
  if (rar === 4 && opt.set){ set = opt.set; slot = opt.slot || pick(SLOTS); name = SETS[set].pre + SET_PART[slot]; }
  else if (rar === 4){
    // smart drop: lean toward a set you already collect, and toward pieces you lack
    const owned = {};
    for (const it of [...equipped(), ...S.inv]) if (it.set) (owned[it.set] = owned[it.set] || new Set()).add(it.slot);
    const keys = Object.keys(owned);
    set = keys.length && Math.random() < 0.5 ? pick(keys) : pick(Object.keys(SETS));
    const missing = SLOTS.filter(sl => !(owned[set] && owned[set].has(sl)));
    slot = missing.length && Math.random() < 0.6 ? pick(missing) : pick(SLOTS);
    name = SETS[set].pre + SET_PART[slot];
  }
  const r = () => rnd(0.9, 1.15) * (rar >= 3 ? 1.15 : 1);
  const base = {};
  if (slot === 'weapon') base.atk = Math.round((5 + ilv * 2.6) * r());
  if (slot === 'head'){ base.def = Math.round((2 + ilv * 1.0) * r()); base.hp = Math.round(ilv * 4 * r()); }

function dayKey(){
  const d = new Date(Date.now() + S.dayOff * 864e5);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function hashStr(t){ let h = 2166136261; for (let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const mktMul = key => 0.5 + seeded(dayKey() + '|' + key);              // 0.5x – 1.5x, changes every day
const mktBase = key => { const [t, k] = key.split(':'); return t === 'mat' ? MATS[k].base : cardPrice(k) * 3; };
const mktBuy = key => Math.max(1, Math.round(mktBase(key) * mktMul(key) * (curPw().haggle ? 0.85 : 1)));
const mktSell = key => Math.max(1, Math.round(mktBase(key) * mktMul(key) * 0.85 * (curPw().appraise ? 1.25 : 1) * (key.startsWith('card:') && curPw().cardSell2 ? 2 : 1)));
function mktSync(){ const d = dayKey(); if (S.market.day !== d){ S.market.day = d; S.market.bought = {}; } }
function mktCardsToday(){
  const keys = Object.keys(CARDS).filter(k => !CARDS[k].rare && !CARDS[k].boss);
  const r = seeded(dayKey() + '|cards');
  const a = keys[Math.floor(r * keys.length)], b = keys[Math.floor(seeded(dayKey() + '|cards2') * keys.length)];
  const out = [...new Set([a, b])];
  const bosses = Object.keys(CARDS).filter(k => CARDS[k].boss);
  if (seeded(dayKey() + '|bosscard') < 0.15) out.push(bosses[Math.floor(seeded(dayKey() + '|bk') * bosses.length)]);
  return out;
}

/* Crafting follows your progress: iLv = deepest floor reached (capped by the material tier) + 2 + mastery bonus. */
const CRAFT_CAP = [20, 30, 40, 9999];
const craftIlv = t => Math.min(CRAFT_CAP[t], Math.max(TIER_ILV[t], S.maxFloor)) + 2 + craftBonusLv();
const craftDisc = () => curPw().bigMerchant ? 0.5 : 1;   // 商人「大商人」
function craftCost(slot, t){ return {mat: slot === 'acc' ? 2 : 3, gold: Math.round(15 * craftIlv(t) * craftDisc())}; }
const craftUniqRate = () => Math.min(0.15, S.craft.m / 999 * 0.12 + 0.006 * facLv('forge'));
/* set crafting: pick the set and the slot; costs a star shard + top material */
const topMatTier = () => Math.min(3, areaOfF(Math.max(1, Math.min(S.maxFloor, 50))));
const setCraftCost = () => { const t = topMatTier(); return {t, mat: 3, star: 1, gold: Math.round(40 * craftIlv(t) * craftDisc())}; };
/* reforge (re-roll one random property). Once an item is reforged, only that same line can be re-rolled again. */
const reforgeCost = it => ({gold: Math.round(30 * it.ilv * (1 + 0.5 * (it.rfn || 0)) * craftDisc()), mat: 2, mk: AREA_MAT[Math.min(3, Math.floor((it.ilv - 1) / 10))]});
function doCraft(slot, t, useStar){
  const c = craftCost(slot, t), mk = AREA_MAT[t];
  if (S.mats[mk] < c.mat || S.gold < c.gold || (useStar && S.mats.star < 1)) return null;
  S.mats[mk] -= c.mat; S.gold -= c.gold; if (useStar) S.mats.star--;
  if (Math.random() >= craftRate()){ S.craft.m = Math.min(999, S.craft.m + 3); save(); return {fail:true}; }
  const ilv = craftIlv(t);
  const uniqs = Object.keys(UNIQ).filter(u => UNIQ[u].slot === slot);
  let it;
  if (uniqs.length && Math.random() < craftUniqRate()) it = genItem(1, false, false, {rar:3, u:pick(uniqs), ilv, crafted:true, extraSlot:useStar});
  else it = genItem(1, false, false, {slot, rar: useStar || Math.random() < craftRareRate() ? 2 : 1, ilv, crafted:true, extraSlot:useStar});
  addInv(it); S.craft.m = Math.min(999, S.craft.m + 5); save();
  return {it};
}
function doCraftSet(setK, slot){
  const c = setCraftCost(), mk = AREA_MAT[c.t];
  if (S.mats[mk] < c.mat || S.mats.star < c.star || S.gold < c.gold) return null;
  S.mats[mk] -= c.mat; S.mats.star -= c.star; S.gold -= c.gold;
  if (Math.random() >= craftRate()){ S.craft.m = Math.min(999, S.craft.m + 3); save(); return {fail:true}; }
  const it = genItem(1, false, false, {rar:4, set:setK, slot, ilv: craftIlv(c.t), crafted:true});
  addInv(it); S.craft.m = Math.min(999, S.craft.m + 8); save();

}
function doReforge(it, i){
  const c = reforgeCost(it);
  if (!it.aff[i] || S.gold < c.gold || S.mats[c.mk] < c.mat || (it.rfi != null && it.rfi !== i)) return null;
  S.gold -= c.gold; S.mats[c.mk] -= c.mat;
  const old = it.aff[i], have = new Set(it.aff.map(a => a.k));

  const k = pick(pool), nw = it.deep ? deepAff(k, it.ilv) : {k, v: affVal(k, it.ilv)};
  it.aff[i] = nw; it.rfi = i; it.rfn = (it.rfn || 0) + 1;

}

  }

  for (let i = 0; i < 10; i++){ const x = Math.floor(((i * 53 - scroll) % 260 + 260) % 260) - 30; ctx.fillRect(x, 92 + (i * 7) % 20, 2, 1); }
}
function shadow(x, y, w){ ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(Math.round(x - w / 2), Math.round(y - 1), w, 2); }
function drawSprAt(key, x, y, flip, sc, white, alpha){
  const c = getSpr(key, white), w = c.width * sc, h = c.height * sc;
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  if (flip){ ctx.translate(Math.round(x), 0); ctx.scale(-1, 1); ctx.drawImage(c, Math.round(-w / 2), Math.round(y - h), w, h); }
  else ctx.drawImage(c, Math.round(x - w / 2), Math.round(y - h), w, h);
  ctx.restore();
}
function drawActor(a, marching){
  const bob = (marching && !a.dead ? (Math.floor(G.t * 6 + a.x) % 2) : 0) + (a.jumping > 0 ? Math.round(44 * Math.sin(Math.PI * (1 - a.jumping / 0.9))) : 0);
  const lx = a.lunge > 0 ? 4 : 0;
  shadow(a.x, a.y, 10);
  if (a.dead){
    ctx.save(); ctx.globalAlpha = 0.5; ctx.translate(Math.round(a.x), Math.round(a.y - 3)); ctx.rotate(-Math.PI / 2);
    const c = getSpr(a.spr); ctx.drawImage(c, -c.width / 2, -c.height / 2); ctx.restore();
    return;
  }
  drawSprAt(a.spr, a.x + lx, a.y - bob, false, 1, a.hitT > 0 && Math.floor(G.t * 30) % 2 === 0);
  if (a.kind === 'hero' && R && R.buff > 0 && Math.floor(G.t * 10) % 2) { ctx.fillStyle = '#ff6a3a'; ctx.fillRect(a.x - 7, a.y - 14, 1, 2); ctx.fillRect(a.x + 6, a.y - 10, 1, 2); }
}
function drawEnemy(e){
  const alpha = e.dead ? Math.max(0, e.fade / 0.3) : 1;
  const lx = e.lunge > 0 ? -4 : 0;
  if (!e.dead) shadow(e.x, e.y, e.w * 0.8);
  const charging = e.boss && e.charge > 0 && Math.floor(G.t * 12) % 2 === 0;
  drawSprAt(SP[e.sp].spr, e.x + lx, e.y, true, e.sc, (e.hitT > 0 || e.dead) && !charging, alpha);
  if (charging){ ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#ff3020'; ctx.fillRect(e.x - e.w / 2, e.y - e.h, e.w, e.h); ctx.restore(); }
  if (e.dead) return;
  if (e.stun > 0){ ctx.fillStyle = '#ffe14a'; const p = G.t * 8; ctx.fillRect(e.x + Math.cos(p) * 4, e.y - e.h - 3, 1, 1); ctx.fillRect(e.x - Math.cos(p) * 4, e.y - e.h - 3, 1, 1); }
  if (e.burn > 0 && Math.floor(G.t * 8) % 2){ ctx.fillStyle = '#ff8a2a'; ctx.fillRect(e.x - 2, e.y - e.h - 1, 1, 2); ctx.fillRect(e.x + 2, e.y - e.h, 1, 2); }
  if (!e.boss && e.hp < e.max){
    ctx.fillStyle = '#000'; ctx.fillRect(Math.round(e.x - 5), Math.round(e.y + 1), 10, 2);
    ctx.fillStyle = '#ec5b4b'; ctx.fillRect(Math.round(e.x - 5), Math.round(e.y + 1), Math.max(1, Math.round(10 * e.hp / e.max)), 2);
  }
}
function drawFx(){
  for (const p of G.parts){ ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  for (const f of G.fx){
    ctx.strokeStyle = f.col; ctx.fillStyle = f.col;
    if (f.k === 'slash'){
      const k = 1 - f.life / 0.18;
      for (let i = -5; i <= 5; i++){ const x = f.x - 6 + k * 3 + i, y = f.y + i * 1.2; ctx.fillRect(Math.round(x), Math.round(y), 2, 1); }
    } else if (f.k === 'bolt'){
      let x = f.x, y = 0;
      while (y < f.y - 2){ const nx = x + rnd(-3, 3); ctx.fillRect(Math.round(Math.min(x, nx)), y, Math.max(1, Math.round(Math.abs(nx - x))), 4); x = nx; y += 4; }
      ctx.fillRect(f.x - 3, f.y - 2, 7, 2);
    } else if (f.k === 'arc' || f.k === 'ring'){
      const r = f.k === 'arc' ? f.r * (1 - f.life / 0.2) + 6 : 10 * (1 - f.life / 0.25) + 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, f.k === 'arc' ? -1 : 0, f.k === 'arc' ? 1 : Math.PI * 2); ctx.lineWidth = 1; ctx.stroke();
    } else if (f.k === 'beam'){
      ctx.save(); ctx.globalAlpha = Math.min(1, f.life); ctx.fillRect(Math.round(f.x - 1), 0, 3, Math.round(f.y)); ctx.restore();
    }
  }
  for (const f of G.floaters){ ctx.save(); ctx.globalAlpha = Math.min(1, f.life * 3); drawNum(f.v, f.x, f.y, f.col, f.sc); ctx.restore(); }
}
function drawCamp(){
  drawBg(THEMES[0], 0);
  // tent
  ctx.fillStyle = '#1b1626';
  ctx.beginPath(); ctx.moveTo(130, 92); ctx.lineTo(152, 62); ctx.lineTo(174, 92); ctx.fill();
  ctx.fillStyle = '#e8d7a8';
  ctx.beginPath(); ctx.moveTo(132, 91); ctx.lineTo(152, 64); ctx.lineTo(172, 91); ctx.fill();
  ctx.fillStyle = '#c94a3a'; ctx.fillRect(151, 58, 2, 8); ctx.fillRect(153, 58, 5, 3);
  ctx.fillStyle = '#5a3a22';
  ctx.beginPath(); ctx.moveTo(146, 91); ctx.lineTo(152, 76); ctx.lineTo(158, 91); ctx.fill();
  // campfire
  ctx.fillStyle = '#5a3a22'; ctx.fillRect(108, 102, 12, 2);
  const fl = Math.floor(G.t * 10) % 3;
  ctx.fillStyle = '#f2802a'; ctx.fillRect(110, 96 - fl, 8, 6 + fl);
  ctx.fillStyle = '#ffe14a'; ctx.fillRect(112, 98 - fl, 4, 4 + fl);
  if (Math.random() < 0.3) G.parts.push({x:114 + rnd(-2, 2), y:94, vx:rnd(-3, 3), vy:-18, life:0.6, col:'#ffb04a'});
  // party standing
  const acts = [{spr:heroSpr(), x:88, y:104}];
  S.party.forEach((id, i) => { const al = id && allyById(id); if (al) acts.push({spr:SP[al.sp].spr, x:[70, 64, 48, 36][i], y:[96, 112, 104, 94][i]}); });
  acts.sort((a, b) => a.y - b.y).forEach(a => { shadow(a.x, a.y, 10); drawSprAt(a.spr, a.x, a.y - (Math.floor(G.t * 2 + a.x) % 2), false, 1); });
  for (const p of G.parts){ ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
}
function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (mode !== 'battle' || !R){ drawCamp(); return; }
  if (R.shake > 0 && !matchMedia('(prefers-reduced-motion: reduce)').matches) ctx.setTransform(1, 0, 0, 1, Math.round(rnd(-2, 2)), Math.round(rnd(-1, 1)));
  drawBg(themeOf(R.floor), R.scroll);
  const marching = R.phase === 'march' || R.phase === 'clear';
  const list = [...R.actors.map(a => ({y:a.y, a})), ...R.enemies.map(e => ({y:e.y, e}))].sort((p, q) => p.y - q.y);
  for (const it of list) it.a ? drawActor(it.a, marching) : drawEnemy(it.e);
  drawFx();
  if (R.freeze > 0){
    const h = R.actors[0];
    ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();
    drawActor(h, false);
    const by = h.y - 26 - Math.round(Math.sin(G.t * 10) * 1);
    drawSprAt('bulb', h.x, by, false, 1);
    if (Math.floor(G.t * 12) % 2){ ctx.fillStyle = '#ffe14a'; ctx.fillRect(h.x - 7, by - 6, 2, 1); ctx.fillRect(h.x + 6, by - 6, 2, 1); ctx.fillRect(h.x, by - 11, 1, 2); }
  }
}

function openMslot(c){

  const groupOf = v => v.startsWith('u:') ? 'u' : v.split(':')[1];
  const groups = [...new Set(all.map(groupOf))];
  if (msFilt !== 'all' && !groups.includes(msFilt)) msFilt = 'all';
  const cnt = g => all.filter(v => groupOf(v) === g).length;
  const chips = [['all', '全部', all.length], ...groups.filter(g => g === 'u').map(g => [g, '抽出した力', cnt(g)]),

/* ---------- save export / import ----------
   format: "PQ2:" + base64(gzip(JSON)) when the browser can compress, else "PQ1:" + base64(JSON) */
const b64FromBytes = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const bytesFromB64 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function exportSave(){
  save();
  const json = JSON.stringify(S), raw = new TextEncoder().encode(json);
  if (window.CompressionStream){
    try { const gz = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); return 'PQ2:' + b64FromBytes(gz); } catch(e){}
  }
  return 'PQ1:' + b64FromBytes(raw);
}
async function importSave(text){
  text = (text || '').replace(/\s+/g, '');
  const m = /^PQ([12]):(.+)$/.exec(text); if (!m) throw new Error('form');
  let bytes = bytesFromB64(m[2]);
  if (m[1] === '2'){ if (!window.DecompressionStream) throw new Error('gzip'); bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()); }
  const obj = JSON.parse(new TextDecoder().decode(bytes));
  if (!obj || obj.v !== 1 || !obj.hero) throw new Error('data');
  return obj;
}

/* Command input: one buffer fed by swipes and arrow keys. Several short strokes in a row join up
   (so ↑↑ can be two flicks). The command fires when input pauses, or at once if nothing longer could follow. */
let gest = null, cmdBuf = '', cmdT = 0, cmdTimer = null;
const CMD_GAP = 450;
function showSeq(seq){ callout(seq.split('').map(c => ARW[c]).join(' ')); }
function cmdFlush(){ clearTimeout(cmdTimer); cmdTimer = null; const sq = cmdBuf; cmdBuf = ''; if (sq) tryCommand(sq); }
function cmdArm(){ clearTimeout(cmdTimer); if (!cmdBuf) return;
  if (cmdMatch(cmdBuf) && !cmdCanGrow(cmdBuf)) cmdFlush(); else cmdTimer = setTimeout(cmdFlush, CMD_GAP); }
function cmdPush(d, newStroke){
  const now = performance.now(); if (now - cmdT > 1200) cmdBuf = ''; cmdT = now;
  if (!newStroke && cmdBuf.slice(-1) === d) return false;
  cmdBuf = (cmdBuf + d).slice(-12); showSeq(cmdBuf); clearTimeout(cmdTimer); return true;
}
cv.addEventListener('pointerdown', e => { if (mode !== 'battle') return; clearTimeout(cmdTimer); gest = {x:e.clientX, y:e.clientY, n:0}; try { cv.setPointerCapture(e.pointerId); } catch(_){} });
cv.addEventListener('pointermove', e => {
  if (!gest) return;
  const dx = e.clientX - gest.x, dy = e.clientY - gest.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
  const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
  if (cmdPush(d, gest.n === 0)) gest.n++;
  gest.x = e.clientX; gest.y = e.clientY;
});
const endGesture = () => { if (!gest) return; gest = null; cmdArm(); };
cv.addEventListener('pointerup', endGesture);
cv.addEventListener('pointercancel', () => { gest = null; cmdArm(); });
document.addEventListener('keydown', e => {
  if (mode !== 'battle') return;
  const d = {ArrowLeft:'L', ArrowRight:'R', ArrowUp:'U', ArrowDown:'D'}[e.key]; if (!d) return;
  e.preventDefault();
  cmdPush(d, true); cmdArm();
});

      const id = +b.dataset.id;
      if (confirmKey === 'bye' + id){ S.allies = S.allies.filter(a => a.id !== id); confirmKey = null; selAlly = null; save(); }
      else confirmKey = 'bye' + id;
      break; }
    case 'equip': {
      const it = S.inv.find(x => x.id === +b.dataset.id); if (!it) break;
      equipItem(it); se('ui'); save(); break; }
    case 'unequip': { const k = b.dataset.k; if (S.equip[k]){ S.inv.push(S.equip[k]); S.equip[k] = null; } se('ui'); save(); break; }
    case 'card': openCardPicker(+b.dataset.id); return;
    case 'csell': {
      const k = b.dataset.k;
      if (confirmKey === 'csell' + k){ S.cards[k]--; S.gold += mktSell('card:' + k); confirmKey = null; se('drop'); save(); }
      else confirmKey = 'csell' + k;
      break; }
    case 'box1': openBoxes(1); return;
    case 'box10': openBoxes(10); return;
    case 'job': if (jobUnlocked(b.dataset.k)){ S.job = b.dataset.k; se('ui'); save(); } break;
    case 'mslot': openMslot(b.dataset.c); return;
    case 'extract': {
      const it = S.inv.find(x => x.id === +b.dataset.id); if (!it || !it.u) break;
      if (confirmKey === 'ex' + it.id){ S.extracted[it.u] = true; S.inv = S.inv.filter(x => x !== it); confirmKey = null; se('stage'); save(); }
      else confirmKey = 'ex' + it.id;
      break; }
    case 'fuseAll': if (confirmKey === 'fuseAll'){ confirmKey = null; bulkFuse(Object.keys(SP)); } else confirmKey = 'fuseAll'; break;
    case 'fuseSp': { const k = b.dataset.k; if (confirmKey === 'fuseSp' + k){ confirmKey = null; bulkFuse([k]); } else confirmKey = 'fuseSp' + k; break; }
    case 'bgmTest': AU.song = null; playSong(b.dataset.k || null); break;
    case 'saveOut': openSaveOut(); return;
    case 'saveIn': openSaveIn(); return;
    case 'helpReset': S.seenHelp = {}; save(); toast('各画面を ひらくと 説明が もう一度 出る'); break;
    case 'town': TOWN = b.dataset.k; se('ui'); break;
    case 'facUp': {
      const k = b.dataset.k, l = facLv(k); if (l >= FAC[k].max) break;
      const cost = FAC[k].cost[l]; if (S.gold < cost) break;
      S.gold -= cost; S.fac[k] = l + 1;
      while (S.party.length < partySize()) S.party.push(null);
      se('stage'); save(); break; }
    case 'refine': {
      const id = +b.dataset.id, it = findItem(id); if (!it) break;
      const r = it.ref || 0, rate = refRate(r), cost = refCost(it);
      if (r >= 10 || S.gold < cost) break;
      if (rate < 1 && confirmKey !== 'ref' + id){ confirmKey = 'ref' + id; break; }
      confirmKey = null; S.gold -= cost; S.stats2.refines++;
      se('anvil');
      if (Math.random() < rate){
        it.ref = r + 1; refName(it); save();
        setTimeout(() => { se(it.ref >= 7 ? 'clear' : 'stage'); }, 350);
        showModal(`<p class="r2">精錬 せいこう！</p><p><span class="r${it.rar}">${esc(it.name)}</span></p><p class="hint">${itemLines(it).join(' ／ ')}</p><div class="opts"><button class="btn primary" data-m="close">OK</button></div>`);
      } else {
        for (const k of EQ) if (S.equip[k] === it) S.equip[k] = null;
        S.inv = S.inv.filter(x => x !== it); S.stats2.broken++; save();
        setTimeout(() => se('wipe'), 350);
        showModal(`<p style="color:#ffb0a6">カキーン… ${esc(it.name)} は こなごなに くだけた。</p><div class="opts"><button class="btn primary" data-m="close">OK</button></div>`);
      }
      return; }
    case 'cslot': craftSlot = b.dataset.k; se('ui'); break;
    case 'craft': {
      const r = doCraft(craftSlot, +b.dataset.t, craftStar && S.mats.star > 0);
      if (!r) break;
      if (r.fail){ se('wipe'); showModal(`<p>しっぱい… 素材が こなごなに なった。</p><p class="hint">鍛冶熟練度 +3（いま ${S.craft.m}）</p><div class="opts"><button class="btn primary" data-m="close">OK</button></div>`); }
      else { se(r.it.rar >= 2 ? 'rare' : 'drop'); showModal(`<p>できあがり！</p><p><span class="r${r.it.rar}">${esc(r.it.name)}</span>（iLv${r.it.ilv}）</p><p class="hint">${itemLines(r.it).join(' ／ ')}</p>${cardPips(r.it)}<p class="hint">鍛冶熟練度 +5（いま ${S.craft.m}）</p><div class="opts"><button class="btn primary" data-m="close">OK</button></div>`); }
      return; }
    case 'cmode': craftMode = b.dataset.k; rfSel = null; se('ui'); break;
    case 'cset': craftSet = b.dataset.k; se('ui'); break;
    case 'craftSet': {
      const r = doCraftSet(craftSet, craftSlot); if (!r) break;
      if (r.fail){ se('wipe'); showModal(`<p>しっぱい… 素材と ほしのかけらが こなごなに なった。</p><div class="opts"><button class="btn primary" data-m="close">OK</button></div>`); }
      else { se('rare'); showModal(`<p>できあがり！</p><p><span class="r4">${esc(r.it.name)}</span>（iLv${r.it.ilv}）</p><p class="hint">${itemLines(r.it).join(' ／ ')}</p><div class="opts"><button class="btn primary" data-m="close">OK</button></div>`); }
      return; }
    case 'rfSel': rfSel = b.dataset.id ? +b.dataset.id : null; se('ui'); break;
    case 'rfDo': {
      const it = findItem(rfSel); if (!it) break;
      const r = doReforge(it, +b.dataset.i); if (!r) break;
      se('anvil');
      showModal(`<p>作り直し！</p><p><span class="hint">${AFF[r.old.k].n} ${AFF[r.old.k].f(r.old.v)}${r.old.q ? ' ' + qStars(r.old.q) : ''}</span> → <span class="r2">${AFF[r.nw.k].n} ${AFF[r.nw.k].f(r.nw.v)}${r.nw.q ? ' ' + qStars(r.nw.q) : ''}</span></p><div class="opts"><button class="btn primary" data-m="close">OK</button></div>`);
      return; }
    case 'mbuy': {
      const key = b.dataset.k, price = mktBuy(key), [t, k] = key.split(':');
      if (S.gold < price) break;
      if (t === 'mat'){ if ((S.market.bought[key] || 0) >= MAT_STOCK) break; S.mats[k]++; }
      else { if (S.market.bought[key]) break; addCard(k); }
      S.gold -= price; S.market.bought[key] = (S.market.bought[key] || 0) + 1; se('drop'); save(); break; }
    case 'msell': { const key = b.dataset.k, k = key.split(':')[1]; if (S.mats[k] > 0){ S.mats[k]--; S.gold += mktSell(key); se('drop'); save(); } break; }
    case 'unstall': {
      const st = S.stall[+b.dataset.i]; if (!st) break;
      if (st.kind === 'item') S.inv.push(st.item); else S.cards[st.key] = (S.cards[st.key] || 0) + 1;
      S.stall.splice(+b.dataset.i, 1); se('ui'); save(); break; }
    case 'stallAdd': openStallPicker(); return;
    case 'sell': {
      e.stopPropagation();
      const it = S.inv.find(x => x.id === +b.dataset.id); if (!it || it.lock) break;
      if (precious(it) && confirmKey !== 'sell' + it.id){ confirmKey = 'sell' + it.id; b.textContent = '本当に売る'; b.classList.add('danger'); return; }
      S.gold += sellPrice(it); S.inv = S.inv.filter(x => x !== it); confirmKey = null; se('drop'); save(); break; }
    case 'sellN':
      if (confirmKey === 'sellN'){ const sold = S.inv.filter(x => x.rar === 0 && !precious(x)); for (const it of sold) S.gold += sellPrice(it); S.inv = S.inv.filter(x => !sold.includes(x)); confirmKey = null; se('drop'); save(); }
      else confirmKey = 'sellN';
      break;
    case 'best':
      for (const k of EQ){
        const cur = S.equip[k];   // uniques / sets / legends are judged by their numbers too
        const kind = k === 'acc2' ? 'acc' : k;
        const cands = S.inv.filter(x => x.slot === kind).sort((a, b) => itemScore(b) - itemScore(a));
        if (cands[0] && itemScore(cands[0]) > itemScore(cur)){ S.equip[k] = cands[0]; S.inv = S.inv.filter(x => x !== cands[0]); if (cur) S.inv.push(cur); }
      }
      se('ui'); save(); break;
    case 'filt': invFilter = b.dataset.k; se('ui'); break;
    case 'gv': GV = b.dataset.k; gSel = null; se('ui'); break;
    case 'gslot': gSlot = b.dataset.k; gSel = null; se('ui'); break;
    case 'gsort': gSort = b.dataset.k; se('ui'); break;
    case 'gup': gUp = !gUp; se('ui'); break;
    case 'gsel': { const id = +b.dataset.id; gSel = gSel === id ? null : id; se('ui'); break; }
    case 'lock': { const it = findItem(+b.dataset.id); if (it){ it.lock = !it.lock; save(); } se('ui'); break; }
    case 'sellWeak':
      if (confirmKey === 'sellWeak'){ const l = S.inv.filter(isWeak); for (const it of l) S.gold += sellPrice(it); S.inv = S.inv.filter(it => !l.includes(it)); confirmKey = null; se('drop'); save(); toast(`${l.length}こ 売った`); }
      else confirmKey = 'sellWeak';
      break;
    case 'grp': { const k = b.dataset.k; openGroups.has(k) ? openGroups.delete(k) : openGroups.add(k); se('ui'); break; }
    case 'isub': { const k = decodeURIComponent(b.dataset.k); openInvSub.has(k) ? openInvSub.delete(k) : openInvSub.add(k); se('ui'); break; }
    case 'sellg': {
      e.stopPropagation();
      const k = decodeURIComponent(b.dataset.k), [sl, nm] = [k.slice(0, k.indexOf('|')), k.slice(k.indexOf('|') + 1)];
      const list = S.inv.filter(it => it.slot === sl && baseName(it) === nm && !precious(it));
      if (confirmKey === 'sellg' + k){ for (const it of list) S.gold += sellPrice(it); S.inv = S.inv.filter(it => !list.includes(it)); confirmKey = null; se('drop'); save(); }
      else confirmKey = 'sellg' + k;
      break; }
    case 'igrp': { const k = b.dataset.k; openInvGroups.has(k) ? openInvGroups.delete(k) : openInvGroups.add(k); se('ui'); break; }
    case 'igrpAll': if (b.dataset.k === '1') SLOTS.forEach(k => openInvGroups.add(k)); else openInvGroups.clear(); se('ui'); break;
    case 'grpAll': if (b.dataset.k === '1') Object.keys(SP).forEach(k => openGroups.add(k)); else openGroups.clear(); se('ui'); break;
    case 'pikon': se('pikon'); break;
    case 'wipe':
      if (confirmKey === 'wipe'){ const snd = S.snd; S = freshSave(); S.snd = snd; confirmKey = null; save(); renderParty(); }
      else confirmKey = 'wipe';
      break;
  }
  renderCamp(); renderParty();
});
$('#panel').addEventListener('change', e => {
  const t = e.target, act = t.dataset.act;
  if (act === 'next'){ S.autoNext = t.checked; updNextBtn(); }
  if (act === 'autoRec') S.autoRecruit = t.checked;
  if (act === 'star'){ craftStar = t.checked; renderCamp(); }
  if (act === 'snd'){ S.snd.on = t.checked; auInit(); auVol(); }
  save();
});
$('#panel').addEventListener('input', e => { if (e.target.dataset.act === 'vol'){ S.snd.vol = +e.target.value; auVol(); } });
$('#panel').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')){ e.preventDefault(); e.target.click(); } });

function coach(){
  showModal(`<p>ぼうけんの すすめかた</p>
    <ul>
      <li>パーティは じどうで すすみ、じどうで こうげきする。</li>
      <li>下の <b>技ボタン</b> を タップすると 技が でる。右上の AUTO で じどう発動（AUTOは 威力と 回転が すこし 落ちる。ここぞは 手で）。</li>
      <li>技は つかうほど 熟練度が あがり、★が ふえて はでになる。</li>
      <li>格上の敵に 技をつかうと、たまに <span style="color:var(--spark)">ピコーン！</span> と あたらしい技を ひらめく。</li>
      <li>たおした まものが おきあがったら、なかまに できる。</li>
      <li>ボスが ちからを ためたら、そのあいだに 技を当てると ひるむ。</li>
    </ul>
    <div class="opts"><button class="btn primary" data-m="coach">わかった</button></div>`);
  S.seenCoach = true; save();
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (let i = 0; i < (mode === 'battle' ? S.speed : 1); i++) update(dt);
  draw(); ui(now);
  requestAnimationFrame(frame);
}
let saveIv = null;
function start(data){
  loadSave(data || {});
  updSpdBtn();
  updNextBtn();
  renderParty(); renderCamp(); renderTop();
  log('ようこそ。じゅんびが できたら しゅつげき しよう。');
  clearInterval(saveIv); saveIv = setInterval(save, 5000);
  setTimeout(() => stallNotice(stallTick(), true), 400);
  setTimeout(() => { if ($('#modal').hidden) jobUnlockNotice(); else checkJobUnlocks(); }, 600);
  setInterval(() => { stallNotice(stallTick(), false); if (mode === 'camp' && TAB === 'town') renderCamp(); }, 60000);
  requestAnimationFrame(frame);
  playSong('camp');
  document.addEventListener('pointerdown', auInit, {once:true});
}
window.claude?.hot?.snapshot?.(() => ({save: S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
// ダウンロード機能（Claudeのページで動くときだけ使う。GitHub Pagesでは通常のダウンロード）
window.__dl = null;
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('downloads').then(d => { window.__dl = d || null; }).catch(() => {});
}
</script>
